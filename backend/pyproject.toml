[project]
name = "retail-sales-intelligence-backend"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
# Runtime dependencies, used by Vercel when it builds the `api` service.
# Keep these pins in step with requirements.txt (used by setup.bat and run.bat).
dependencies = [
    "fastapi==0.135.4",
    "pydantic==2.13.5",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    "openpyxl==3.1.5",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
    "httpx2==2.13.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
